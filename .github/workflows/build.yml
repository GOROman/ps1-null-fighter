# Build the PlayStation CD image with PSn00bSDK v0.24 on every push and pull
# request, zip it with the manual and the changelog, keep a rolling "latest"
# pre-release on main, and make a proper release on v* tags.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  SDK_VERSION: "0.24"
  GCC_ZIP: gcc-mipsel-none-elf-12.3.0-linux.zip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # release upload on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps for the asset pipeline
        run: pip install numpy pillow xatlas

      - name: Cache PSn00bSDK + toolchain
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/psn00bsdk
          key: psn00bsdk-${{ env.SDK_VERSION }}-${{ env.GCC_ZIP }}

      - name: Download PSn00bSDK + toolchain
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p ~/psn00bsdk && cd ~/psn00bsdk
          base=https://github.com/Lameguy64/PSn00bSDK/releases/download/v${SDK_VERSION}
          curl -sSL -o sdk.zip "$base/PSn00bSDK-${SDK_VERSION}-Linux.zip"
          curl -sSL -o gcc.zip "$base/${GCC_ZIP}"
          unzip -q sdk.zip -d sdk
          unzip -q gcc.zip -d gcc
          rm sdk.zip gcc.zip
          chmod -R a+rx sdk gcc

      - name: Locate the SDK
        run: |
          set -eux
          sdk_cmake=$(find ~/psn00bsdk/sdk -name sdk.cmake -path '*libpsn00b/cmake/*' | head -1)
          gcc_bin=$(dirname "$(find ~/psn00bsdk/gcc -name mipsel-none-elf-gcc -type f | head -1)")
          sdk_bin=$(dirname "$(find ~/psn00bsdk/sdk -name mkpsxiso -type f | head -1)")
          echo "PSN00BSDK_LIBS=$(dirname "$(dirname "$sdk_cmake")")" >> "$GITHUB_ENV"
          echo "$gcc_bin" >> "$GITHUB_PATH"
          echo "$sdk_bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset default .

      - name: Build
        run: cmake --build ./build --verbose

      - name: Package
        run: |
          set -eux
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="$GITHUB_REF_NAME"; else ver="main-$(git rev-parse --short HEAD)"; fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          d="nullfighter-$ver"
          mkdir -p "$d"
          cp build/nullfighter.bin build/nullfighter.cue "$d/"
          cp docs/遊び方.md "$d/MANUAL.md"
          cp CHANGELOG.md "$d/"
          cp docs/release-readme.txt "$d/README.txt"
          printf '%s\n%s\n%s\n' "御意見有用 $ver" "commit $(git rev-parse HEAD)" "built $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$d/VERSION.txt"
          zip -9 -r "$d.zip" "$d"
          ls -l "$d" "$d.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: nullfighter-${{ env.VER }}
          path: nullfighter-${{ env.VER }}.zip

      - name: Release notes
        if: github.event_name == 'push'
        run: |
          set -eux
          git fetch --tags --force --quiet || true
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            echo "## $VER"
            echo
            echo "cue / bin の CD イメージ、操作説明 (MANUAL.md)、変更履歴 (CHANGELOG.md) 入り。"
            echo
            if [[ -n "$prev" ]]; then echo "### $prev 以降のコミット"; git log --format='- %s' "$prev"..HEAD; else echo "### コミット"; git log --format='- %s' -20; fi
          } > notes.md

      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$VER" "nullfighter-$VER.zip" --title "御意見有用 $VER" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rolling "latest" pre-release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -eux
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "nullfighter-$VER.zip" --prerelease --title "御意見有用 latest ($VER)" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
